<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #641B2E 0%, #3E1024 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Serif Devanagari', serif;
        }
        .container {
            text-align: center;
            color: #FFF8ED;
            padding: 60px;
            border: 3px solid #C8A45D;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.2);
            max-width: 900px;
        }
        .om {
            font-size: 48px;
            color: #E8D6A5;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 90px;
            color: #C8A45D;
            margin: 20px 0;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 42px;
            color: #E8D6A5;
            margin: 30px 0;
            font-weight: 600;
        }
        .couples {
            font-size: 36px;
            line-height: 1.6;
            color: #FFF8ED;
            margin: 25px 0;
        }
        .date {
            font-size: 38px;
            color: #C8A45D;
            margin-top: 30px;
            font-weight: 600;
        }
        .divider {
            width: 200px;
            height: 2px;
            background: #C8A45D;
            margin: 25px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="om">🕉️</div>
        <h1>शुभ विवाह</h1>
        <div class="subtitle">Royal Indian Wedding</div>
        <div class="divider"></div>
        <div class="couples">
            Aayu. Ekta & Vi. Vikas<br>
            Aayu. Priyanka & Vi. Bijendra
        </div>
        <div class="divider"></div>
        <div class="date">December 2026</div>
        <div style="font-size: 28px; margin-top: 15px; color: #FFF8ED;">
            Gunti, Bahroi, Rajasthan
        </div>
    </div>
</body>
</html>
